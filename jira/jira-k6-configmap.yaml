apiVersion: v1
kind: ConfigMap
metadata:
  name: jira-k6-script
  namespace: perf-test
data:
  jira-k6.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import exec from 'k6/execution';

    export const options = {
      stages: [
        { duration: '5m', target: 50 },
        { duration: '10m', target: 100 },
        { duration: '10m', target: 200 },
        { duration: '10m', target: 300 },
        { duration: '10m', target: 400 },
        { duration: '5m', target: 0 },
      ],
      thresholds: {
        http_req_failed: ['rate<0.01'],
        http_req_duration: ['p(95)<3000'],
      },
    };

    const BASE_URL = (__ENV.BASE_URL || '').replace(/\/$/, '');
    const API_VERSION = __ENV.JIRA_API_VERSION || '2'; // 2 or 3
    const AUTH_MODE = __ENV.AUTH_MODE || 'bearer'; // bearer | basic
    const TOKEN = __ENV.JIRA_TOKEN || '';
    const BASIC_AUTH = __ENV.JIRA_BASIC_AUTH || ''; // base64(email:token) or base64(user:pass)

    const PROJECT = __ENV.JIRA_PROJECT || 'DEMO';
    const SEARCH_MAX = Number(__ENV.SEARCH_MAX || '20');
    const UPDATE_MODE = __ENV.UPDATE_MODE || 'comment'; // comment | transition
    const ISSUE_KEY_PREFIX = __ENV.ISSUE_KEY_PREFIX || PROJECT;
    const UPDATE_ISSUE_COUNT = Number(__ENV.UPDATE_ISSUE_COUNT || '200');
    const MIN_SLEEP = Number(__ENV.MIN_SLEEP || '1');
    const MAX_SLEEP = Number(__ENV.MAX_SLEEP || '3');
    const JQL = __ENV.JQL || `project = ${PROJECT} ORDER BY updated DESC`;
    const TRANSITION_ID = __ENV.TRANSITION_ID || ''; // required if UPDATE_MODE=transition

    function authHeaders(json = true) {
      const headers = {
        Accept: 'application/json',
      };

      if (json) {
        headers['Content-Type'] = 'application/json';
      }

      if (AUTH_MODE === 'basic') {
        headers['Authorization'] = `Basic ${BASIC_AUTH}`;
      } else {
        headers['Authorization'] = `Bearer ${TOKEN}`;
      }

      return { headers };
    }

    function randomIssueKey() {
      const n = (exec.vu.idInTest % UPDATE_ISSUE_COUNT) + 1;
      return `${ISSUE_KEY_PREFIX}-${n}`;
    }

    function searchIssues() {
      const url = `${BASE_URL}/rest/api/${API_VERSION}/search`;

      const payload = JSON.stringify({
        jql: JQL,
        startAt: 0,
        maxResults: SEARCH_MAX,
        fields: ['summary', 'updated', 'status', 'priority'],
      });

      const res = http.post(url, payload, authHeaders(true));

      check(res, {
        'search status 200': (r) => r.status === 200,
        'search has issues': (r) => {
          try {
            const body = r.json();
            return Array.isArray(body.issues);
          } catch (_) {
            return false;
          }
        },
      });

      return res;
    }

    function getIssue(issueKey) {
      const fields = encodeURIComponent('summary,description,updated,status,priority');
      const url = `${BASE_URL}/rest/api/${API_VERSION}/issue/${issueKey}?fields=${fields}`;

      const res = http.get(url, authHeaders(false));

      check(res, {
        'get issue status 200': (r) => r.status === 200,
      });

      return res;
    }

    function addComment(issueKey) {
      const url = `${BASE_URL}/rest/api/${API_VERSION}/issue/${issueKey}/comment`;
      const payload = JSON.stringify({
        body: `k6 perf test comment vu=${exec.vu.idInTest} iter=${exec.scenario.iterationInTest}`,
      });

      const res = http.post(url, payload, authHeaders(true));

      check(res, {
        'comment create status 200/201': (r) => r.status === 200 || r.status === 201,
      });

      return res;
    }

    function transitionIssue(issueKey) {
      const url = `${BASE_URL}/rest/api/${API_VERSION}/issue/${issueKey}/transitions`;
      const payload = JSON.stringify({
        transition: {
          id: TRANSITION_ID,
        },
      });

      const res = http.post(url, payload, authHeaders(true));

      check(res, {
        'transition status 200/204': (r) => r.status === 200 || r.status === 204,
      });

      return res;
    }

    export default function () {
      if (!BASE_URL) {
        throw new Error('BASE_URL is required');
      }

      if (AUTH_MODE === 'basic' && !BASIC_AUTH) {
        throw new Error('JIRA_BASIC_AUTH is required when AUTH_MODE=basic');
      }

      if (AUTH_MODE === 'bearer' && !TOKEN) {
        throw new Error('JIRA_TOKEN is required when AUTH_MODE=bearer');
      }

      const pick = Math.random();

      // 80% search, 20% update
      if (pick < 0.8) {
        const searchRes = searchIssues();

        let issues = [];
        try {
          const body = searchRes.json();
          issues = body.issues || [];
        } catch (_) {
          issues = [];
        }

        if (issues.length > 0) {
          const issue = issues[Math.floor(Math.random() * issues.length)];
          if (issue && issue.key) {
            getIssue(issue.key);
          }
        }
      } else {
        const issueKey = randomIssueKey();

        getIssue(issueKey);

        if (UPDATE_MODE === 'transition') {
          if (!TRANSITION_ID) {
            throw new Error('TRANSITION_ID is required when UPDATE_MODE=transition');
          }
          transitionIssue(issueKey);
        } else {
          addComment(issueKey);
        }
      }

      sleep(Math.random() * (MAX_SLEEP - MIN_SLEEP) + MIN_SLEEP);
    }